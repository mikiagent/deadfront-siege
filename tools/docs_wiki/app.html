<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEADFRONT · Docs Wiki</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/app.css">
<script src="/marked.min.js"></script>
</head>
<body>
<header>
  <div class="brand">DEADFRONT <span>docs wiki</span></div>
  <input id="q" type="search" placeholder="Filter docs…" autocomplete="off">
  <nav id="tabs">
    <button data-tab="browse" class="on">Browse</button>
    <button data-tab="systems">Systems</button>
    <button data-tab="reconcile" id="reconcileTab">Reconcile <span id="reconcileCount" class="count"></span></button>
    <button data-tab="map">Canon map</button>
  </nav>
  <div class="hbtns">
    <button id="exportBtn" title="Download canon-map.md + reconcile queue + state.json">Export</button>
  </div>
</header>
<main>
  <aside id="sidebar"></aside>
  <section id="pane"></section>
</main>
<script src="/app.js"></script>
</body>
</html>
