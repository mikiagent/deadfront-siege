# Scope base: this worktree was cut from claude/mmo-switch2d at c86edabd, which already merged the
# card2d and sprites2d branches; the default merge-base with claude/mmo-overhaul predates those merges
# and would list their files as this job's.
BASE=c86edabd
TEST=t_switch2d
LAB=switch2d_lab
REQUIRE_FILES="game/tests/t_switch2d.gd"
LAB_ARGS=""
LAB_ALARM=900
MIN_SHOTS=4
