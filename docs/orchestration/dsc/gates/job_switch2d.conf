RELATED="t_card2d t_stepover t_occlude"
SCOPE='^(game/scripts/world/(card_prop|harvest_node|island_scatter|card_bake)\.gd|game/shaders/card_sway\.gdshader|game/data/(card2d|world/rules|world/sprites2d_map)\.json|game/project\.godot|game/tests/t_(switch2d|card2d)\.gd|game/scripts/dev/(switch2d|card2d)_lab\.gd|game/scenes/dev/(switch2d|card2d)_lab\.tscn|docs/orchestration/)'
