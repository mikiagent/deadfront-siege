TEST=t_biomeprops
LAB=biomeprops_lab
REQUIRE_FILES="game/tests/t_biomeprops.gd"
LAB_ARGS=""
LAB_ALARM=600
MIN_SHOTS=2
MS_STAGE2=3
# Every biome prop kind must (a) resolve to a model that actually exists, (b) carry a material that
# uses its baked vertex colour as albedo, and (c) be scaled to the kind's declared radius. The kinds
# themselves must end up placed on a live island, which is what the props.json remap was for.
LAB_ASSERT="v['kinds']>=8 and v['vcol_ok']==v['kinds'] and v['scale_ok']==v['kinds'] and v['placed']>=5 and v['missing_files']==0"
RELATED="t_props t_biome t_biomes"
SCOPE='^(tools/blender/biome_props/|game/assets/nature/biome/|game/data/world/(props|biome_assets)\.json|game/scripts/world/(island_props|island_scatter)\.gd|game/tests/t_biomeprops\.gd|game/scripts/dev/biomeprops_lab\.gd|game/scenes/dev/biomeprops_lab\.tscn|docs/orchestration/)'
