# BIOMEPROPS gate settings. verify_job.sh &lt;key&gt; reads this from the job's scratch dir; the copy that
# ships with the branch is this file, so the integration gate runs the same checks.
TEST=t_biomeprops
LAB=biomeprops_lab
REQUIRE_FILES="game/tests/t_biomeprops.gd"
LAB_ARGS=""
LAB_ALARM=900
MIN_SHOTS=2
MS_STAGE2=9
# No colour-space key: which COLOR_0 encoding is right is a rendered-frame question (AGX + sky
# ambient), not a number a headless run can settle. The lab's PNGs are the evidence.
LAB_ASSERT="v['kinds']>=11 and v['vcol_ok']==v['kinds'] and v['scale_ok']==v['kinds'] and v['placed']>=8 and v['missing_files']==0"
RELATED="t_biome t_props"
SCOPE='^(game/tests/t_biomeprops\.gd|game/tests/t_biome\.gd|game/data/world/props\.json|game/scripts/world/island_props\.gd|game/scripts/dev/biomeprops_lab\.gd|game/scenes/dev/biomeprops_lab\.tscn|game/assets/nature/biome/|tools/blender/biome_props/|docs/orchestration/)'
