name: Godot iOS Upload (dulvui-derived)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and iOS export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Install signing certificate and App Store Connect key
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$API_KEY_DIR/AuthKey_$ASC_API_KEY_ID.p8"
          chmod 600 "$API_KEY_DIR/AuthKey_$ASC_API_KEY_ID.p8"
          KEY_FINGERPRINT="$(openssl pkey -in "$API_KEY_DIR/AuthKey_$ASC_API_KEY_ID.p8" -pubout -outform DER 2>/dev/null | shasum -a 256 | awk '{print $1}')"
          [[ "$KEY_FINGERPRINT" == "fbd8f52405643043d7a71f7fb87e810bde0489da9397d4fd779845c44e00aaf4" ]]
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_SHA1="$(openssl pkcs12 -in "$CERTIFICATE_PATH" -passin pass:"$P12_PASSWORD" -clcerts -nokeys 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          [[ "$CERT_SHA1" == "AEA060BAE33BB5E6D4C37431D3366AE06F82BDF7" ]]

      - name: Install verified provisioning profile
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages cryptography
          python3 <<'PYASC'
          import base64, json, os, pathlib, time, urllib.request, plistlib, subprocess, tempfile
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography import x509
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          kid=os.environ['ASC_API_KEY_ID']; issuer='e932d878-2780-4029-8f69-e5a4d9bdcb65'
          key=serialization.load_pem_private_key((pathlib.Path.home()/'.appstoreconnect/private_keys'/f'AuthKey_{kid}.p8').read_bytes(),None)
          b64=lambda b:base64.urlsafe_b64encode(b).rstrip(b'='); now=int(time.time())
          h=b64(json.dumps({'alg':'ES256','kid':kid,'typ':'JWT'},separators=(',',':')).encode()); p=b64(json.dumps({'iss':issuer,'iat':now,'exp':now+600,'aud':'appstoreconnect-v1'},separators=(',',':')).encode()); si=h+b'.'+p
          r,s=decode_dss_signature(key.sign(si,ec.ECDSA(hashes.SHA256()))); tok=(si+b'.'+b64(r.to_bytes(32,'big')+s.to_bytes(32,'big'))).decode()
          def get(path): return json.load(urllib.request.urlopen(urllib.request.Request('https://api.appstoreconnect.apple.com'+path,headers={'Authorization':'Bearer '+tok})))
          bundle=get('/v1/bundleIds?filter%5Bidentifier%5D=com.durangolike.dev&limit=10')['data'][0]
          prof=next(x for x in get(f"/v1/bundleIds/{bundle['id']}/profiles?limit=200")['data'] if x['attributes']['name']=='DurangoLike CI App Store' and x['attributes']['profileState']=='ACTIVE')
          out=pathlib.Path.home()/'Library/MobileDevice/Provisioning Profiles'/f"{prof['attributes']['uuid']}.mobileprovision"; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(base64.b64decode(prof['attributes']['profileContent']))
          with tempfile.NamedTemporaryFile() as d:
            subprocess.run(['openssl','smime','-inform','der','-verify','-noverify','-in',str(out),'-out',d.name],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); d.seek(0); pl=plistlib.load(d)
          assert pl['UUID']=='6462a2dc-4fbd-460b-885b-53ef5ead6dd9'
          assert [x509.load_der_x509_certificate(c).fingerprint(hashes.SHA1()).hex().upper() for c in pl['DeveloperCertificates']]==['AEA060BAE33BB5E6D4C37431D3366AE06F82BDF7']
          PYASC

      - name: Godot export (dulvui pipeline)
        run: |
          set -euo pipefail
          godot --headless --path game --editor --quit-after 360 || true
          godot --headless --path game --export-release iOS export/ios/durango.xcodeproj
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game/export/ios/durango/durango-Info.plist'); s=p.read_text()
          if 'ITSAppUsesNonExemptEncryption' not in s: p.write_text(s.replace('</dict>\n</plist>','\t<key>ITSAppUsesNonExemptEncryption</key>\n\t<false/>\n</dict>\n</plist>',1))
          PY

      - name: Archive, export and upload (dulvui pipeline, API-key auth)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          xcodebuild -project game/export/ios/durango.xcodeproj -scheme durango -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/durango.xcarchive" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=U6SV8Z7K4S PROVISIONING_PROFILE_SPECIFIER='DurangoLike CI App Store' CODE_SIGN_IDENTITY='iPhone Distribution' MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'PL'
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>destination</key><string>export</string><key>teamID</key><string>U6SV8Z7K4S</string><key>signingStyle</key><string>manual</string><key>signingCertificate</key><string>AEA060BAE33BB5E6D4C37431D3366AE06F82BDF7</string><key>provisioningProfiles</key><dict><key>com.durangolike.dev</key><string>DurangoLike CI App Store</string></dict><key>uploadSymbols</key><true/></dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/durango.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" -exportPath "$RUNNER_TEMP/ipa"
          IPA="$RUNNER_TEMP/ipa/durango.ipa"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer e932d878-2780-4029-8f69-e5a4d9bdcb65
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer e932d878-2780-4029-8f69-e5a4d9bdcb65
