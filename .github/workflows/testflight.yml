name: Upload iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and iOS export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Install signing certificate and App Store Connect key
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$API_KEY_DIR/AuthKey_678H6PU9Y9.p8"
          chmod 600 "$API_KEY_DIR/AuthKey_678H6PU9Y9.p8"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Export, sign, validate, and upload
        env:
          GODOT_PATH: ${{ env.GODOT }}
        run: |
          set -euo pipefail
          export GODOT_PATH="$(command -v godot)"

          # Give xcodebuild the App Store Connect API key for automatic provisioning on this clean runner.
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/xcodebuild" <<'SH'
          #!/usr/bin/env bash
          exec /usr/bin/xcodebuild "$@" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_678H6PU9Y9.p8" \
            -authenticationKeyID 678H6PU9Y9 \
            -authenticationKeyIssuerID e932d878-2780-4029-8f69-e5a4d9bdcb65
          SH
          chmod +x "$RUNNER_TEMP/bin/xcodebuild"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          tools/release_ios.sh

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-diagnostics
          path: |
            ~/Library/Caches/durango-release/ipa/*.ipa
            ~/Library/Caches/durango-release/*.xcdistributionlogs
          if-no-files-found: ignore
          retention-days: 7
